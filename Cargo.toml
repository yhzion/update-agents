[package]
name = "update-agents"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "update-agents"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["use-dev-tty"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true

opt-level = "z"